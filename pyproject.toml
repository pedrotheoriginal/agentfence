[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfence"
version = "0.1.0"
description = "The terminal firewall for autonomous AI agents and developers. Let AI act. Keep control."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ai", "agents", "security", "cli", "firewall", "terminal", "llm"]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
agentfence = "main:app"

[tool.setuptools]
py-modules = ["main"]
packages = ["agentfence_core"]